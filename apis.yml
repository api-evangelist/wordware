aid: wordware
name: Wordware
description: >-
  Wordware is a San Francisco AI company (YC S23, backed by Felicis and Spark
  Capital) that built a web-hosted IDE for building AI agents and LLM
  applications with natural language "flows". Every flow can be deployed as a
  standalone WordApp that is simultaneously a web app and a streaming REST API,
  authenticated with bearer API keys and versioned with a simplified
  major.minor scheme. In 2026 the company pivoted its flagship product to
  Sauna, a proactive AI assistant, while the Wordware V1 platform and its
  WordApps API remain available at app.wordware.ai.
