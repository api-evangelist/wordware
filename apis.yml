apis:
- name: Wordware WordApps API
  description: >-
    Run deployed WordApps programmatically. Each published WordApp exposes a
    run endpoint (POST /api/released-app/{app_id}/run) that accepts a JSON
    body of named inputs (text, image, audio) plus a semantic version selector
    (e.g. "^1.0"), authenticates with a bearer API key, and streams newline-
    delimited JSON chunks (generation / chunk / outputs events) as the flow
    executes.
